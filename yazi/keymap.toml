# Fixed mappings for the embedded Yazi profile.
# The plugin prepends these entries to the user's existing keymap.toml.

[mgr]
prepend_keymap = [
    { on = "~", run = "plugin --mode=sync nvim-yzfm -- viewmode", desc = "Cycle small, tiny, and large views" },
    { on = "<C-o>", run = "plugin --mode=sync nvim-yzfm -- edit", desc = "Open in the current buffer" },
    { on = "<C-x>", run = "plugin --mode=sync nvim-yzfm -- split", desc = "Open in a horizontal split" },
    { on = "<C-v>", run = "plugin --mode=sync nvim-yzfm -- vsplit", desc = "Open in a vertical split" },
    { on = "<C-t>", run = "plugin --mode=sync nvim-yzfm -- tabedit", desc = "Open in a new tab" },
    { on = "l", run = "plugin --mode=sync nvim-yzfm -- edit", desc = "Enter directory or open file" },
    { on = "<Enter>", run = "plugin --mode=sync nvim-yzfm -- edit", desc = "Enter directory or open file" },
]
